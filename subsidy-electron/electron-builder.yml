appId: com.subsidy.electron
productName: SubsidySystem
copyright: Copyright © 2024

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - package.json

# sql.js 需要 WASM 文件，asar 解包
asar:
  smartUnpack: true

asarUnpack:
  - "node_modules/sql.js/**"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  sign: null
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 农户补贴管理系统
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png
  language: 2052

mac:
  target:
    - dmg
  icon: resources/icon.png

linux:
  target:
    - AppImage
  icon: resources/icon.png

compression: normal
