<body>
<x-dc>
<helmet>
<style>
  body{margin:0}
  a{color:#1A4D3A;text-decoration:none}

<div style="width:1440px;height:900px;background:radial-gradient(circle at 12% 0%,#E8F6F0 0%,rgba(232,246,240,0) 38%),radial-gradient(circle at 92% 100%,#E8F3F8 0%,rgba(232,243,248,0) 34%),#F8F5F0;font-family:'Microsoft YaHei','PingFang SC',-apple-system,'Segoe UI',sans-serif;color:#2B2B26;overflow:hidden;font-size:13px;line-height:1.5;position:relative">
  <header style="height:96px;overflow:hidden;background:#F8F5F0;border-bottom:1px solid #E8E2D9">
    <img src="/_blob/10f58ada1f4cc6d30b2d358df418bc53" alt="农户补贴管理系统" style="width:100%;height:96px;object-fit:cover;object-position:left center;display:block">
  </header>

  <nav style="height:48px;background:linear-gradient(90deg,#0F3D2E,#1A5C46 55%,#2C7A63);display:flex;align-items:center;padding:0 28px;box-shadow:0 4px 14px rgba(15,61,46,.16);gap:2px">
    <a href="Main.dc.html" style="padding:0 16px;height:48px;display:flex;align-items:center;color:rgba(255,255,255,.82);font-size:13px;border-bottom:2px solid transparent">首页</a>
    <a href="Farmers.dc.html" style="padding:0 16px;height:48px;display:flex;align-items:center;color:rgba(255,255,255,.82);font-size:13px;border-bottom:2px solid transparent">农户列表</a>
    <a href="Subsidies.dc.html" style="padding:0 16px;height:48px;display:flex;align-items:center;color:#F7F3E7;font-size:13px;background:rgba(255,255,255,.12);border-bottom:2px solid #D8B567;font-weight:600">补贴总览</a>
    <a href="#" style="padding:0 16px;height:48px;display:flex;align-items:center;color:rgba(255,255,255,.82);font-size:13px;border-bottom:2px solid transparent">数据分析</a>
    <a href="#" style="padding:0 16px;height:48px;display:flex;align-items:center;color:rgba(255,255,255,.82);font-size:13px;border-bottom:2px solid transparent">土地流转</a>
    <a href="#" style="padding:0 16px;height:48px;display:flex;align-items:center;color:rgba(255,255,255,.82);font-size:13px;border-bottom:2px solid transparent">大户管理</a>
    <a href="#" style="padding:0 16px;height:48px;display:flex;align-items:center;color:rgba(255,255,255,.82);font-size:13px;border-bottom:2px solid transparent">补贴查询</a>
    <a href="#" style="padding:0 16px;height:48px;display:flex;align-items:center;color:rgba(255,255,255,.82);font-size:13px;border-bottom:2px solid transparent">数据工具</a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <span style="font-size:12px;color:rgba(255,255,255,.7)">王平</span>
      <div style="width:28px;height:28px;border-radius:99px;background:#E6C288;color:#1A4D3A;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">WP</div>
    </div>
  </nav>

  <div style="max-width:1320px;margin:0 auto;padding:16px 24px 18px;display:flex;gap:16px;height:756px">
    <aside style="width:206px;flex-shrink:0;background:#fff;border:1px solid #E8E2D9;border-radius:8px;padding:10px 8px;height:100%">
      <div style="font-size:11px;color:#9A9588;letter-spacing:.08em;padding:6px 10px 5px">户籍管理</div>
      <a href="Farmers.dc.html" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:#5A5A4F;font-size:12.5px">农户列表</a>
      <a href="Household.dc.html" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:#5A5A4F;font-size:12.5px">家庭户</a>
      <a href="#" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:#5A5A4F;font-size:12.5px">村组联系人</a>
      <a href="AttributeImport.dc.html" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:#5A5A4F;font-size:12.5px">人员属性导入</a>
      <div style="height:1px;background:#F0EBE1;margin:8px 10px"></div>
      <div style="font-size:11px;color:#9A9588;letter-spacing:.08em;padding:6px 10px 5px">补贴管理</div>
      <a href="Subsidies.dc.html" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-left:3px solid #1A4D3A;background:#EDF3EF;color:#1A4D3A;font-size:12.5px;font-weight:600;border-radius:0 4px 4px 0">项目总览</a>
      <a href="AnnualAnalysis.dc.html" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:#5A5A4F;font-size:12.5px">项目年度分析</a>
      <a href="Anomalies.dc.html" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;color:#5A5A4F;font-size:12.5px">异常中心</a>
    </aside>

    <main style="flex:1;min-width:0;display:flex;flex-direction:column;opacity:.45;pointer-events:none">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;height:38px;margin-bottom:8px">
        <div><h1 style="margin:0;font-size:20px;font-weight:700;color:#1A4D3A">补贴管理</h1><div style="font-size:11px;color:#8C877A;margin-top:2px">2026 年度 · 6 个补贴项目</div></div>
        <button style="height:30px;padding:0 12px;border:1px solid #1A4D3A;background:#1A4D3A;border-radius:4px;font-size:12px;color:#F7F3E7">新建项目</button>
      </div>
      <div style="background:#fff;border:1px solid #E8E2D9;border-radius:8px;flex:1;padding:14px">
        <div style="height:34px;background:#F6F1E7;border-radius:4px"></div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
          <div style="height:52px;border:1px solid #F0EBE1;border-radius:4px"></div>
          <div style="height:52px;border:1px solid #F0EBE1;border-radius:4px"></div>
          <div style="height:52px;border:1px solid #F0EBE1;border-radius:4px"></div>
          <div style="height:52px;border:1px solid #F0EBE1;border-radius:4px"></div>
          <div style="height:52px;border:1px solid #F0EBE1;border-radius:4px"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 遮罩 + 弹窗 -->
  <div style="position:absolute;inset:0;background:rgba(20,30,25,.42)"></div>
  <div style="position:absolute;left:50%;top:150px;transform:translateX(-50%);width:760px;background:#fff;border:1px solid #E8E2D9;border-radius:8px;box-shadow:0 18px 48px rgba(20,30,25,.22);overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #F2EDE3">
      <div>
        <div style="font-size:16px;font-weight:700;color:#1A4D3A">新建补贴项目</div>
        <div style="font-size:10.5px;color:#8C877A;margin-top:2px">项目按年度独立建档，可关联上一年度同类项目形成补贴链</div>
      </div>
      <button aria-label="关闭" style="width:28px;height:28px;border:1px solid #E8E2D9;background:#fff;border-radius:4px;color:#8C877A;cursor:pointer">×</button>
    </div>

    <div style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px">
      <div style="grid-column:1 / -1">
        <label for="project-name" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">项目名称 <span style="color:#D32F2F">*</span></label>
        <input id="project-name" value="2026 年大春水稻补贴" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 10px;font-size:12px;color:#2B2B26;outline:none">
      </div>

      <div>
        <label for="year" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">补贴年度 <span style="color:#D32F2F">*</span></label>
        <select id="year" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 8px;font-size:12px;background:#fff;color:#2B2B26"><option>2026</option><option>2025</option></select>
      </div>
      <div>
        <label for="season" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">季节分类 <span style="color:#D32F2F">*</span></label>
        <select id="season" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 8px;font-size:12px;background:#fff;color:#2B2B26"><option>大春</option><option>小春</option><option>耕地地力保护</option><option>临时</option></select>
      </div>

      <div style="grid-column:1 / -1">
        <div style="font-size:11px;color:#6B6B60;margin-bottom:5px">计算方式 <span style="color:#D32F2F">*</span></div>
        <div style="display:flex;gap:8px">
          <label style="flex:1;border:1px solid #1A4D3A;background:#F3F7F4;border-radius:6px;padding:8px 10px;display:flex;align-items:flex-start;gap:8px;cursor:pointer">
            <input type="radio" name="calc" checked style="accent-color:#1A4D3A;margin-top:2px">
            <span><b style="font-size:12px">按亩计算</b><span style="display:block;font-size:10px;color:#8C877A;margin-top:1px">每亩金额 × 补贴面积</span></span>
          </label>
          <label style="flex:1;border:1px solid #E8E2D9;border-radius:6px;padding:8px 10px;display:flex;align-items:flex-start;gap:8px;cursor:pointer">
            <input type="radio" name="calc" style="accent-color:#1A4D3A;margin-top:2px">
            <span><b style="font-size:12px">固定金额</b><span style="display:block;font-size:10px;color:#8C877A;margin-top:1px">按户或按人发放固定金额</span></span>
          </label>
        </div>
      </div>

      <div>
        <label for="amount" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">每亩金额（元）</label>
        <input id="amount" value="120.00" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 10px;font-size:12px;color:#2B2B26;outline:none">
      </div>
      <div>
        <label for="unit" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">计量单位</label>
        <select id="unit" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 8px;font-size:12px;background:#fff;color:#2B2B26"><option>元/亩</option><option>元/户</option><option>元/人</option></select>
      </div>

      <div>
        <label for="fund" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">资金来源</label>
        <select id="fund" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 8px;font-size:12px;background:#fff;color:#2B2B26"><option>中央</option><option>省级</option><option>县级</option></select>
      </div>
      <div>
        <label for="category" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">项目分类</label>
        <select id="category" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 8px;font-size:12px;background:#fff;color:#2B2B26"><option>种植业</option><option>耕地保护</option><option>临时救助</option></select>
      </div>

      <div>
        <label for="deadline" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">申报截止日期</label>
        <input id="deadline" type="date" value="2026-05-31" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 10px;font-size:12px;color:#2B2B26;outline:none">
      </div>
      <div>
        <label for="prev" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">上一年同类补贴</label>
        <select id="prev" style="width:100%;height:34px;border:1px solid #E8E2D9;border-radius:4px;padding:0 8px;font-size:12px;background:#fff;color:#2B2B26"><option>2025 年大春水稻补贴</option><option>不关联</option></select>
      </div>

      <div style="grid-column:1 / -1">
        <label for="desc" style="display:block;font-size:11px;color:#6B6B60;margin-bottom:4px">项目说明</label>
        <textarea id="desc" rows="2" style="width:100%;border:1px solid #E8E2D9;border-radius:4px;padding:8px 10px;font-size:12px;color:#2B2B26;outline:none;resize:none">按大春水稻实际种植面积核定，补贴标准 120 元/亩。</textarea>
      </div>

      <div style="grid-column:1 / -1;display:flex;align-items:center;gap:6px;background:#FBF8F0;border:1px solid #E8DCC2;border-radius:4px;padding:7px 10px;font-size:10px;color:#6B5322">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A6620" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/></svg>
        保存后可在项目总览中导入预申请、执行预检并转为发放记录。
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #F2EDE3;background:#FBFAF6">
      <button style="height:32px;padding:0 14px;border:1px solid #E8E2D9;background:#fff;border-radius:4px;font-size:12px;color:#5A5A4F;cursor:pointer">取消</button>
      <button style="height:32px;padding:0 14px;border:1px solid #1A4D3A;background:#1A4D3A;border-radius:4px;font-size:12px;color:#F7F3E7;cursor:pointer">保存项目</button>
    </div>
  </div>
</div>
</x-dc>
